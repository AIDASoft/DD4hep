name: macOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches-ignore:
      - dependabot/**

jobs:
  macOS:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Brew install
      run: |
        brew install root boost ninja
        pip install pytest
    - name: Compile
      run: |
        mkdir build
        cd build
        cmake -GNinja -DDD4HEP_USE_GEANT4=OFF -DBoost_NO_BOOST_CMAKE=ON -DDD4HEP_USE_LCIO=OFF -DBUILD_TESTING=ON -DDD4HEP_USE_XERCESC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DDD4HEP_RELAX_PYVER=ON ..
        ninja

  default:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-26
          xcode: "26.0.1"
          LCG: "LCG_110/arm64-mac26-clang170-opt"
        - os: macos-15
          xcode: "16.4"
          LCG: "LCG_110/arm64-mac15-clang170-opt"
        - os: macos-15
          xcode: "16.4"
          LCG: "dev3/arm64-mac15-clang170-opt"
        - os: macos-15
          xcode: "16.4"
          LCG: "dev4/arm64-mac15-clang170-opt"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: cvmfs-contrib/github-action-cvmfs@bbbf3dbec6e6cea8f95fd9e1b5ff31e23bf33b8e
      with:
        cvmfs_repositories: sft.cern.ch,sft-nightlies.cern.ch,geant4.cern.ch
    - uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6
      with:
        release-platform: ${{ matrix.LCG }}
        ccache-key: ccache-${{ matrix.LCG }}
        run: |
          clang --version
          mkdir build
          cd build
          unset CPATH
          # Common CMake options
          source ../.github/scripts/common_cmake_opts.sh
          echo "::group::CMakeConfig C++20"
          cmake \
            $=COMMON_CMAKE_OPTS \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            ..
          echo "::endgroup::"
          if [[ ${{ matrix.LCG }} =~ dev[34] ]]; then
            echo "::group::CMakeConfig 2"
            cmake \
              -DDD4HEP_HEPMC3_COMPRESSION_SUPPORT=ON \
              -DDD4HEP_USE_G4HEPEM=ON \
              ..
            echo "::endgroup::"
          fi
          echo "::group::Compile"
          ninja install
          ccache -s
          echo "::endgroup::"
          echo "::group::Test"
          . ../bin/thisdd4hep.sh
          ctest --output-on-failure -j"$(getconf _NPROCESSORS_ONLN)" --output-junit TestResults_1.xml
          echo "::endgroup::"
          echo "::group::CMakeExamples"
          cd ../examples/
          mkdir build
          cd build
          source ../../.github/scripts/common_cmake_opts.sh
          cmake \
            $=COMMON_EXAMPLES_CMAKE_OPTS \
            -DCMAKE_CXX_STANDARD=20 \
            ..
          echo "::endgroup::"
          echo "::group::CompileExamples"
          ninja install
          ccache -s
          echo "::endgroup::"
          # Diagnose duplicate libDDCore loads in ACLiC tests. Call root.exe directly:
          # SIP strips DYLD_* when the bash test wrappers start.
          echo "::group::DiagnoseACLiC"
          (
            export DD4hepExamplesINSTALL=${GITHUB_WORKSPACE}/examples
            . ../bin/thisCLICSiD.sh
            . ../bin/thisLHeD.sh
            ex=${DD4hepExamplesINSTALL}/examples
            for macro in "${GITHUB_WORKSPACE}/examples/DDG4/examples/run.C(\"${ex}/CLICSiD/scripts/CLICSiDXML\")" \
                         "${ex}/LHeD/scripts/run.C(\"${ex}/LHeD/scripts/LHeDXML\")"; do
              echo "=== ${macro}"
              DYLD_PRINT_LIBRARIES=1 root.exe -b -x -n -q -l "${macro}" > aclic_diag.log 2>&1 || true
              echo "--- DD4hep / macro images loaded, in load order:"
              grep -E "dyld\[[0-9]+\]: .*(libDD|_C\.so)" aclic_diag.log || true
              echo "--- duplicate dictionary registrations: $(grep -c 'already in TClassTable' aclic_diag.log)"
              grep -E "unknown variable|non existent registry" aclic_diag.log || true
            done
            for so in ${ex}/CLICSiD/scripts/CLICSiDXML_C.so ${ex}/LHeD/scripts/LHeDXML_C.so; do
              echo "--- otool -L ${so}"; otool -L ${so} || true
              echo "--- LC_RPATH ${so}"; otool -l ${so} | grep -A2 LC_RPATH || true
            done
          ) || true
          echo "::endgroup::"
          echo "::group::TestExamples"
          ctest --output-on-failure -j"$(getconf _NPROCESSORS_ONLN)" --output-junit TestResults_2.xml
          echo "::endgroup::"
    - name: Prepare Artifact Name
      if: success() || failure()
      run: |
          artifact_name="${{ matrix.LCG }}"
          artifact_name=$(echo -n "${artifact_name}" | sed -e 's@/@@g')
          echo "ARTIFACT_NAME=${artifact_name}" >> $GITHUB_ENV
    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results ${{ env.ARTIFACT_NAME }}
        path: |
           ${{ github.workspace }}/build/TestResults_1.xml
           ${{ github.workspace }}/examples/build/TestResults_2.xml
